services:
  gateway:
    build: .
    container_name: llm-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MASTER_SECRET: "${MASTER_SECRET:?Set a long random MASTER_SECRET in .env}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:8080}"
      BOOTSTRAP_ADMIN_EMAIL: "${BOOTSTRAP_ADMIN_EMAIL:-admin@corp.local}"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:-Admin@12345}"
      MAX_CONCURRENT_REQUESTS: "5000"
      TRUST_PROXY: "true"
      LOG_LEVEL: "info"
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
